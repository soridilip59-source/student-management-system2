version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:7
    container_name: sms-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
    networks:
      - sms-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: sms-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongodb:27017/${MONGO_DATABASE:-student-management-system}?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - sms-network
    restart: unless-stopped

  # Nginx (optional - for serving frontend and proxying backend)
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: sms-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sms-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  sms-network:
    driver: bridge
